name: Update street rarity data

on:
  schedule:
    # Once a year (January 1st, 03:00 UTC)
    - cron: "0 3 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scheduled runs and dispatches from main check out main;
          # dispatches from a feature branch check out that branch.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build data
        run: python scripts/build_data.py

      - name: Run tests
        run: pytest -q

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.min.json examples.json meta.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update street rarity data $(date -u +%Y-%m-%d)"
            git push origin "${{ github.ref_name }}"
          fi
