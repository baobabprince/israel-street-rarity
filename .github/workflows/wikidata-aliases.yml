name: Build Wikidata J9U aliases (legacy)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build Wikidata aliases
        run: python scripts/build_mazal_aliases.py
      - name: Rebuild street data
        run: python scripts/build_data.py
      - name: Run tests
        run: pytest -q
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mazal_aliases.json data/mazal_aliases_provenance.json data.json data.min.json examples.json meta.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh Wikidata J9U aliases and street data"
            git push origin "${{ github.ref_name }}"
          fi
