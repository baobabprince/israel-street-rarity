name: Build Mazal aliases (NLI Identity API)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Inspect NLI Identity API
        env:
          MAZAL_API_KEY: ${{ secrets.MAZAL_API_KEY }}
        run: python scripts/mazal_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: mazal-probe
          path: mazal-probe.json
          retention-days: 1
